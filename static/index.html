<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>LLM Token 中枢</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#e5e7eb; --muted:#94a3b8;
    --primary:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --line:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 8px;
         border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;flex:1;min-width:120px}
  .btn{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{background:var(--err)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  main{padding:12px 16px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .card2{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .row{display:flex;align-items:center;gap:8px}
  .title{font-size:15px;font-weight:600}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .amount{font-size:22px;font-weight:700}
  .amount.na{font-size:14px;font-weight:500;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.warn{background:var(--warn)}
  .kv{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .toolbar{display:flex;gap:8px;margin-bottom:12px}
  #login{max-width:360px;margin:22vh auto;padding:20px}
  input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:10px 12px;font-size:15px;margin-top:8px;font-family:inherit}
  textarea{resize:vertical;line-height:1.5}
  .select{position:relative;margin-top:8px}
  .select-trigger{display:flex;align-items:center;justify-content:space-between;
       background:var(--card2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:10px 12px;font-size:15px;cursor:pointer}
  .select-trigger .caret{color:var(--muted);font-size:12px;margin-left:8px}
  .select-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;margin:0;
       background:var(--card);border:1px solid var(--line);border-radius:8px;
       max-height:240px;overflow:auto;padding:4px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none}
  .select-menu.open{display:block}
  .select-item{padding:10px 12px;border-radius:6px;font-size:14px;cursor:pointer;list-style:none}
  .select-item:hover{background:var(--card2)}
  .select-item .sub{font-size:11px;color:var(--muted);margin-top:2px}
  label{font-size:13px;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
  .sheet{background:var(--card);border-top-left-radius:16px;border-top-right-radius:16px;
         padding:16px;padding-bottom:32px;width:100%;max-height:88vh;overflow:auto}
  .sheet h3{margin:0 0 6px;font-size:16px}
  .close{position:absolute;right:14px;top:10px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111827;
         border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:50}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 0}
  code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<header id="appHeader" style="display:none">
  <h1>LLM Token 中枢</h1>
  <button class="btn sm" id="tabTokens" onclick="switchTab('tokens')">密钥</button>
  <button class="btn sm ghost" id="tabModels" onclick="switchTab('models')">模型库</button>
  <button class="btn sm ghost" onclick="openSettings()">设置</button>
  <button class="btn sm ghost" onclick="logout()">退出</button>
</header>

<main id="app" style="display:none">
  <div id="tabTokensView">
    <div class="toolbar">
      <button class="btn ghost" style="flex:1" onclick="refreshAll()">一键刷新全部额度</button>
      <button class="btn" onclick="openAdd()">+ 添加</button>
    </div>
    <div id="list"><div class="empty">加载中…</div></div>
  </div>

  <div id="tabModelsView" style="display:none">
    <div class="toolbar">
      <button class="btn ghost" style="flex:1" onclick="openImport()">从平台导入模型</button>
      <button class="btn" onclick="openAddModel()">+ 添加</button>
    </div>
    <div class="toolbar">
      <input id="modelSearch" placeholder="搜索模型名 / 说明 / 来源平台" style="flex:1;margin-top:0"
             oninput="renderModels()" onkeydown="if(event.key==='Enter')renderModels()">
      <button class="btn" onclick="renderModels()">搜索</button>
    </div>
    <div id="modelList"><div class="empty">加载中…</div></div>
  </div>
</main>

<div id="login" class="card">
  <h3 style="margin:0 0 10px">登录</h3>
  <label>访问密码（ADMIN_PASSWORD）</label>
  <input id="pwd" type="password" placeholder="请输入访问密码" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" style="width:100%;margin-top:12px" onclick="login()">进入</button>
  <p class="sub" style="margin-top:12px">数据仅保存在你自己的服务器本地，不会上传任何第三方。</p>
</div>

<div class="overlay" id="sheet">
  <div class="sheet">
    <div class="row"><h3 id="sheetTitle">添加 Key</h3></div>
    <input type="hidden" id="editId">
    <label>平台</label>
    <div class="select" id="platformSelect">
      <div class="select-trigger" id="platformTrigger" onclick="togglePlatform()">
        <span id="platformLabel">请选择平台</span><span class="caret">▾</span>
      </div>
      <ul class="select-menu" id="platformMenu"></ul>
    </div>
    <input type="hidden" id="platform" value="">
    <label>备注名称</label>
    <input id="label" placeholder="例如：主力账号 / 测试账号">
    <label>API Key</label>
    <input id="apiKey" placeholder="sk-xxxxxx" autocomplete="off">
    <label>API Base URL（留空用平台默认）</label>
    <input id="baseUrl" placeholder="https://api.deepseek.com">
    <label>备注</label>
    <input id="remark" placeholder="用途、额度说明等（可选）">
    <div id="platformTip" class="sub" style="margin-top:10px"></div>
    <div class="actions">
      <button class="btn" onclick="save()">保存</button>
      <button class="btn ghost" onclick="closeSheet()">取消</button>
    </div>
  </div>
</div>

<div class="overlay" id="importSheet">
  <div class="sheet">
    <div class="row"><h3>从平台导入模型</h3><button class="btn sm ghost" onclick="closeImport()">关闭</button></div>
    <label>选择账号（将调用该账号的 OpenAI 兼容 /v1/models 接口）</label>
    <div id="importAccounts" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
    <div id="importResults" style="margin-top:12px"></div>
  </div>
</div>

<div class="overlay" id="modelSheet">
  <div class="sheet">
    <div class="row"><h3 id="modelTitle">添加模型</h3><button class="btn sm ghost" onclick="closeModelSheet()">关闭</button></div>
    <input type="hidden" id="modelEditId">
    <label>模型名（如 deepseek-chat）</label>
    <input id="modelName" placeholder="模型 ID">
    <label>说明 / 适用场景（可留空，稍后用 AI 生成）</label>
    <textarea id="modelDesc" placeholder="例如：擅长中文写作、代码生成、知识问答…"></textarea>
    <div class="actions">
      <button class="btn" onclick="saveModel()">保存</button>
      <button class="btn ghost" onclick="closeModelSheet()">取消</button>
    </div>
  </div>
</div>

<div class="overlay" id="setSheet">
  <div class="sheet">
    <div class="row"><h3>设置</h3><button class="btn sm ghost" onclick="closeSet()">关闭</button></div>

    <div class="card">
      <div class="title">修改登录密码</div>
      <label>当前登录密码</label>
      <input id="curPw" type="password" autocomplete="off">
      <label>新登录密码（至少 6 位）</label>
      <input id="newPw" type="password" autocomplete="off">
      <label>确认新登录密码</label>
      <input id="newPw2" type="password" autocomplete="off">
      <button class="btn" style="margin-top:10px" onclick="changePassword()">保存登录密码</button>
      <div class="sub" style="margin-top:6px">修改后其他设备的登录会话会失效，需重新登录。</div>
    </div>

    <div class="card">
      <div class="title">修改加密密钥</div>
      <div id="secHint" class="sub"></div>
      <label>登录密码（确认身份）</label>
      <input id="secLogin" type="password" autocomplete="off">
      <label>新的加密密钥（至少 8 位）</label>
      <input id="newSec" type="password" autocomplete="off">
      <label>确认新加密密钥</label>
      <input id="newSec2" type="password" autocomplete="off">
      <button class="btn" style="margin-top:10px" onclick="changeSecret()">保存加密密钥</button>
      <div class="sub" style="margin-top:6px">将用新密钥重新加密库内全部 Key 与 AI 密钥；Key 较多时耗时稍长，过程中请勿关闭服务。</div>
    </div>

    <div class="card">
      <div class="title">AI 模型说明配置</div>
      <div class="sub">配置一个 OpenAI 兼容的对话接口，用于一键为模型生成「适用场景说明」。密钥以加密方式存储。</div>
      <label>接口地址 Base URL（如 https://api.openai.com/v1）</label>
      <input id="aiBase" placeholder="https://api.openai.com/v1">
      <label>模型名（如 gpt-4o-mini）</label>
      <input id="aiModel" placeholder="gpt-4o-mini">
      <label>API Key（留空表示不修改）</label>
      <input id="aiKey" type="password" autocomplete="off">
      <button class="btn" style="margin-top:10px" onclick="saveAi()">保存 AI 配置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let PLATFORMS = [];
let ACCOUNTS = [];
let MODELS = [];
let currentTab = 'tokens';
let lastModels = [];
let lastSource = '';
let lastPlatform = '';

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.display='none',2200); }
async function api(url,opt={}){ const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){ showLogin(); throw new Error('未登录'); } return r.json(); }
function showLogin(){ $('login').style.display='block'; $('app').style.display='none'; $('appHeader').style.display='none'; }
function showApp(){ $('login').style.display='none'; $('app').style.display='block'; $('appHeader').style.display='flex'; }

async function login(){ const pwd=$('pwd').value; if(!pwd){toast('请输入密码');return;}
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
  if(r.ok){ $('pwd').value=''; showApp(); await loadAll(); } else { toast('密码错误'); } }
async function logout(){ await fetch('/api/logout',{method:'POST'}); showLogin(); }

async function switchTab(t){
  currentTab=t;
  $('tabTokens').className = 'btn sm'+(t==='tokens'?'':' ghost');
  $('tabModels').className = 'btn sm'+(t==='models'?'':' ghost');
  $('tabTokensView').style.display = t==='tokens'?'block':'none';
  $('tabModelsView').style.display = t==='models'?'block':'none';
  if(t==='models') await renderModels();
}

async function openSettings(){
  const d=await api('/api/settings');
  $('secHint').textContent = d.has_accounts
    ? '当前库内已有 Key，保存后会对全部 Key 重新加密。'
    : '当前库内暂无 Key，可直接设置加密密钥。';
  const ai=await api('/api/settings/ai');
  $('aiBase').value=ai.base_url||''; $('aiModel').value=ai.model||''; $('aiKey').value='';
  $('setSheet').style.display='flex';
}
function closeSet(){ $('setSheet').style.display='none'; }

async function changePassword(){
  const cur=$('curPw').value, n1=$('newPw').value, n2=$('newPw2').value;
  if(!cur||!n1){ toast('请填写完整'); return; }
  if(n1.length<6){ toast('新密码至少 6 位'); return; }
  if(n1!==n2){ toast('两次输入不一致'); return; }
  const r=await fetch('/api/settings/password',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({current:cur,new:n1})});
  const d=await r.json();
  if(!r.ok){ toast(d.msg||'修改失败'); return; }
  toast('登录密码已修改，请重新登录');
  ['curPw','newPw','newPw2'].forEach(k=>$(k).value='');
  closeSet();
  await fetch('/api/logout',{method:'POST'});
  showLogin();
}

async function changeSecret(){
  const login=$('secLogin').value, n1=$('newSec').value, n2=$('newSec2').value;
  if(!login||!n1){ toast('请填写完整'); return; }
  if(n1.length<8){ toast('加密密钥至少 8 位'); return; }
  if(n1!==n2){ toast('两次输入不一致'); return; }
  if(!confirm('确认用新密钥重新加密库内全部 Key 与 AI 密钥？')) return;
  toast('正在重新加密，请稍候…');
  const r=await fetch('/api/settings/secret',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({login_password:login,new_secret:n1})});
  const d=await r.json();
  if(!r.ok){ toast(d.msg||'修改失败'); return; }
  toast('加密密钥已更新');
  ['secLogin','newSec','newSec2'].forEach(k=>$(k).value='');
  closeSet();
}

async function saveAi(){
  const base=$('aiBase').value.trim(), model=$('aiModel').value.trim(), key=$('aiKey').value;
  if(!base||!model){ toast('接口地址和模型名必填'); return; }
  const r=await fetch('/api/settings/ai',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({base_url:base,model,key})});
  const d=await r.json();
  if(!r.ok){ toast(d.msg||'保存失败'); return; }
  toast('AI 配置已保存'); $('aiKey').value='';
}

async function loadAll(){
  const p=await api('/api/platforms'); PLATFORMS=p.items;
  buildPlatformMenu();
  await render();
}

function buildPlatformMenu(){
  const base = PLATFORMS.map(x=>({name:x.name,
    label:x.display+(x.support_balance?'（可查额度）':'（仅托管）'),
    sub:(x.models||[]).join('、')}));
  base.push({name:'custom', label:'自定义平台（仅托管 Key）', sub:'仅做 Key 托管与复制，不查询额度'});
  $('platformMenu').innerHTML = base.map(it=>
    `<li class="select-item" data-name="${it.name}" onclick="selectPlatform('${it.name}')">`
    + `<div>${it.label}</div><div class="sub">${it.sub||''}</div></li>`).join('');
}

function setPlatformValue(name){
  $('platform').value=name;
  const li=$('platformMenu').querySelector(`[data-name="${name}"]`);
  $('platformLabel').textContent = li ? li.querySelector('div').textContent : (name==='custom'?'自定义平台':'请选择平台');
}
function togglePlatform(){ $('platformMenu').classList.toggle('open'); }
function closePlatformMenu(){ $('platformMenu').classList.remove('open'); }
function selectPlatform(name){ setPlatformValue(name); closePlatformMenu(); onPlatformChange(); }
document.addEventListener('click',e=>{ if($('platformSelect') && !$('platformSelect').contains(e.target)) closePlatformMenu(); });

async function render(){
  const d=await api('/api/accounts');
  ACCOUNTS = d.items;
  const el=$('list');
  if(!ACCOUNTS.length){ el.innerHTML='<div class="empty">还没有 Key，点右上角「+ 添加」开始</div>'; return; }
  el.innerHTML = ACCOUNTS.map(a=>{
    const st = a.balance_status;
    const dot = st==='ok'?'ok':(st==='error'||st==='invalid'?'err':(st==='unsupported'?'warn':''));
    const amount = a.balance!=null ? `<span class="amount">${a.balance_currency==='USD'?'$':'¥'}${a.balance}</span>`
      : `<span class="amount na">${st==='unsupported'?'该平台无公开余额接口':'未查询'}</span>`;
    const ts = a.balance_updated_at ? new Date(a.balance_updated_at*1000).toLocaleString('zh-CN') : '';
    return `<div class="card">
      <div class="row">
        <span class="dot ${dot}"></span>
        <div style="flex:1">
          <div class="title">${escape(a.platform_display)}${a.label?' · '+escape(a.label):''}</div>
          <div class="sub">${escape(a.base_url||'-')}${a.remark?' · '+escape(a.remark):''}</div>
        </div>
        <div style="text-align:right">${amount}<div class="sub">${ts}</div></div>
      </div>
      <div class="kv"><span>${st==='invalid'?'Key 失效':st==='error'?'查询失败':st==='unsupported'?'不支持查询':'正常'}</span></div>
      <div class="actions">
        <button class="btn sm" onclick="copyKey(${a.id})">复制 Key</button>
        <button class="btn sm ghost" onclick="copyAddress(${a.id})">复制地址</button>
        <button class="btn sm ghost" onclick="copyConfig(${a.id})">复制配置</button>
        <button class="btn sm ghost" onclick="refreshOne(${a.id})">刷新额度</button>
        <button class="btn sm ghost" onclick="editAccount(${a.id})">编辑</button>
        <button class="btn sm ghost" onclick="openConsole('${a.console}',${a.id})">去创建/管理 Key</button>
        <button class="btn sm danger" onclick="delAccount(${a.id})">删除</button>
      </div></div>`;
  }).join('');
}

function escape(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 复制到剪贴板：Clipboard API → execCommand 兜底 → 弹窗（http 内网也能一键复制）
function doCopy(text){
  return new Promise(resolve=>{
    const done=ok=>resolve(ok);
    const fallback=()=>{
      try{
        const ta=document.createElement('textarea');
        ta.value=text; ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0,text.length);
        const ok=document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      }catch(e){ done(false); }
    };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(()=>done(true)).catch(fallback);
    } else fallback();
  });
}

async function copyKey(id){
  const d=await api(`/api/accounts/${id}/key`);
  if(!d.ok){ toast(d.msg||'获取失败'); return; }
  (await doCopy(d.api_key)) ? toast('已复制 Key') : prompt('请手动复制：', d.api_key);
}
async function copyAddress(id){
  const a=ACCOUNTS.find(x=>x.id===id);
  if(!a || !a.base_url){ toast('该账号无 API 地址'); return; }
  (await doCopy(a.base_url)) ? toast('已复制 API 地址') : prompt('请手动复制：', a.base_url);
}
async function copyConfig(id){
  const a=ACCOUNTS.find(x=>x.id===id);
  if(!a){ toast('未找到记录'); return; }
  const d=await api(`/api/accounts/${id}/key`);
  if(!d.ok){ toast(d.msg||'获取失败'); return; }
  const text = `base_url: ${a.base_url||'(平台默认)'}\napi_key: ${d.api_key}`;
  (await doCopy(text)) ? toast('已复制 地址+Key') : prompt('请手动复制：', text);
}

async function refreshOne(id){ toast('查询中…'); const d=await api(`/api/accounts/${id}/refresh`,{method:'POST'});
  toast(d.ok?'余额已更新：'+d.balance:(d.msg||'查询失败')); await render(); }

async function refreshAll(){ toast('正在刷新全部额度…'); const d=await api('/api/refresh-all',{method:'POST'});
  toast(`完成：成功 ${d.ok_count} 个${d.failed&&d.failed.length?'，失败 '+d.failed.length+' 个':''}`); await render(); }

function openAdd(){ $('editId').value=''; $('sheetTitle').textContent='添加 Key';
  ['apiKey','label','baseUrl','remark'].forEach(k=>$(k).value='');
  if(PLATFORMS.length) selectPlatform(PLATFORMS[0].name);
  else { $('platform').value=''; $('platformLabel').textContent='请选择平台'; }
  $('sheet').style.display='flex'; }
function closeSheet(){ $('sheet').style.display='none'; }
async function editAccount(id){ const d=await api('/api/accounts'); const a=d.items.find(x=>x.id===id);
  $('editId').value=id; $('sheetTitle').textContent='编辑 Key'; setPlatformValue(a.platform);
  $('label').value=a.label; $('baseUrl').value=a.base_url; $('remark').value=a.remark; $('apiKey').value='';
  $('apiKey').placeholder='留空表示不修改'; onPlatformChange(); $('sheet').style.display='flex'; }

function onPlatformChange(){ const p=PLATFORMS.find(x=>x.name===$('platform').value);
  if(!p){ $('platformTip').textContent='自定义平台：仅做 Key 托管与复制，不查询额度。'; $('baseUrl').placeholder='https://your-api.example.com/v1'; return; }
  $('baseUrl').placeholder=p.base_url||'';
  $('platformTip').innerHTML = `${p.support_balance?'支持额度查询':'该平台无公开余额接口，仅托管 Key'} · 常用模型：<code>${(p.models||[]).join('</code> <code>')||'-'}</code>`;
}

async function save(){
  const id=$('editId').value; const body={platform:$('platform').value,label:$('label').value,
    api_key:$('apiKey').value,base_url:$('baseUrl').value,remark:$('remark').value};
  if(!id && !body.api_key){ toast('请填写 API Key'); return; }
  const r=await fetch(id?`/api/accounts/${id}`:'/api/accounts',{method:id?'PUT':'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){ toast(d.msg||'保存失败'); return; }
  closeSheet(); toast('已加密保存'); await render(); }

async function delAccount(id){ if(!confirm('确认删除这条 Key 记录？')) return;
  await api(`/api/accounts/${id}`,{method:'DELETE'}); toast('已删除'); await render(); }

async function openConsole(url,id){ if(url){ window.open(url,'_blank'); toast('已打开官方控制台，创建新 Key 后回到这里添加'); } else toast('该平台无控制台链接'); }

// ---------------- 模型库 ----------------
function platformBadge(m){
  // 来源平台徽章：导入的显示平台名，手动的显示「手动」，旧数据无平台则不显示
  if(m.platform){
    const p=PLATFORMS.find(x=>x.name===m.platform);
    const label=p?p.display:m.platform;
    return `<span class="badge" style="color:var(--primary);border-color:var(--primary);margin-left:8px">${escape(label)}</span>`;
  }
  if(m.source==='manual') return `<span class="badge" style="margin-left:8px">手动</span>`;
  return '';
}
async function renderModels(){
  const d=await api('/api/models');
  MODELS=d.items; const ai=d.ai_configured;
  const kw=($('modelSearch')?.value||'').trim().toLowerCase();
  const shown = kw
    ? MODELS.filter(m=>(m.name+'\n'+(m.description||'')+'\n'+(m.source_label||'')+'\n'+(m.platform||'')).toLowerCase().includes(kw))
    : MODELS;
  const el=$('modelList');
  if(!MODELS.length){ el.innerHTML='<div class="empty">还没有模型，点「从平台导入模型」拉取或手动添加</div>'; return; }
  if(!shown.length){ el.innerHTML=`<div class="empty">没有匹配「${escape(kw)}」的模型（共 ${MODELS.length} 个）</div>`; return; }
  el.innerHTML = `<div class="sub" style="margin:0 0 8px">${kw?`匹配 ${shown.length} / `:''}共 ${MODELS.length} 个模型</div>` + shown.map(m=>`
    <div class="card">
      <div class="row">
        <div style="flex:1">
          <div class="title" style="display:flex;align-items:center;flex-wrap:wrap">${escape(m.name)}${platformBadge(m)}</div>
          <div class="sub">来源：${m.source_label?`来自 ${escape(m.source_label)}`:(m.source==='manual'?'手动添加':'平台导入')} · 更新于 ${new Date(m.updated_at*1000).toLocaleString('zh-CN')}</div>
        </div>
      </div>
      <div class="card2" style="margin-top:8px;white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--text)">
        ${m.description?escape(m.description):'<span style="color:var(--muted)">暂无说明，点「AI 生成说明」或「编辑说明」补充适用场景</span>'}
      </div>
      <div class="actions">
        <button class="btn sm" onclick="copyModelName(${m.id})">复制模型名</button>
        <button class="btn sm ghost" ${ai?'':'disabled title="请先在设置中配置 AI 接口"'} onclick="aiDescribe(${m.id})">AI 生成说明</button>
        <button class="btn sm ghost" onclick="editModel(${m.id})">编辑说明</button>
        <button class="btn sm danger" onclick="delModel(${m.id})">删除</button>
      </div>
    </div>`).join('');
}

async function openImport(){
  const d=await api('/api/accounts');
  const accs=d.items;
  if(!accs.length){ toast('请先添加至少一个账号'); return; }
  $('importAccounts').innerHTML = accs.map(a=>
    `<button class="btn ghost" style="text-align:left" onclick="queryAccountModels(${a.id})">${escape(a.platform_display)}${a.label?' · '+escape(a.label):''}</button>`).join('');
  $('importResults').innerHTML='';
  $('importSheet').style.display='flex';
}
function closeImport(){ $('importSheet').style.display='none'; }

async function queryAccountModels(id){
  toast('查询模型中…');
  const acc=ACCOUNTS.find(x=>x.id===id);
  lastSource=acc ? ((acc.platform_display||'')+(acc.label?' · '+acc.label:'')) : '';
  lastPlatform=acc ? (acc.platform||'') : '';
  const d=await api(`/api/accounts/${id}/models`,{method:'POST'});
  if(!d.ok){ toast(d.msg||'查询失败'); return; }
  lastModels=d.items;
  if(!d.items.length){ $('importResults').innerHTML='<div class="sub">该接口未返回模型列表（可能不支持 /v1/models）。</div>'; return; }
  $('importResults').innerHTML = `<div class="sub">共 ${d.count} 个模型 · 来自 <b style="color:var(--text)">${escape(lastSource||d.platform_display||'所选账号')}</b>（${escape(d.url)}）</div>
    <div style="margin-top:8px">${d.items.map((m,i)=>`<div class="row" style="margin-top:6px"><input type="checkbox" id="imp_${i}" checked> <label style="flex:1;color:var(--text);font-size:13px">${escape(m)}</label></div>`).join('')}</div>
    <button class="btn" style="margin-top:12px" onclick="importSelected()">导入选中模型</button>`;
}
async function importSelected(){
  const names=lastModels.filter((_,i)=>$(`imp_${i}`)?.checked);
  if(!names.length){ toast('请至少勾选一个'); return; }
  for(const n of names){
    await api('/api/models',{method:'POST',body:JSON.stringify({name:n,source:'import',source_label:lastSource||'',platform:lastPlatform||''})});
  }
  toast(`已导入 ${names.length} 个模型（来源：${lastSource||'所选账号'}）`);
  $('importResults').innerHTML='';
  await renderModels();
}

function openAddModel(){ $('modelEditId').value=''; $('modelTitle').textContent='添加模型';
  $('modelName').value=''; $('modelName').disabled=false; $('modelDesc').value=''; $('modelSheet').style.display='flex'; }
function closeModelSheet(){ $('modelSheet').style.display='none'; }
async function editModel(id){ const m=MODELS.find(x=>x.id===id);
  $('modelEditId').value=id; $('modelTitle').textContent='编辑说明';
  $('modelName').value=m.name; $('modelName').disabled=true; $('modelDesc').value=m.description;
  $('modelSheet').style.display='flex'; }
async function saveModel(){
  const id=$('modelEditId').value; const name=$('modelName').value.trim(); const desc=$('modelDesc').value;
  if(!name){ toast('请填写模型名'); return; }
  if(id){ await api(`/api/models/${id}`,{method:'PUT',body:JSON.stringify({description:desc})}); }
  else { const r=await api('/api/models',{method:'POST',body:JSON.stringify({name,description:desc,source:'manual'})}); if(!r.ok){toast('保存失败');return;} }
  closeModelSheet(); toast('已保存'); await renderModels();
}
async function delModel(id){ if(!confirm('确认删除该模型？')) return;
  await api(`/api/models/${id}`,{method:'DELETE'}); toast('已删除'); await renderModels(); }
async function copyModelName(id){ const m=MODELS.find(x=>x.id===id);
  (await doCopy(m.name)) ? toast('已复制模型名') : prompt('请手动复制：',m.name); }
async function aiDescribe(id){
  toast('AI 生成中，请稍候…');
  const d=await api(`/api/models/${id}/ai-describe`,{method:'POST'});
  if(!d.ok){ toast(d.msg||'生成失败'); return; }
  toast('已生成适用场景说明'); await renderModels();
}

// 启动
fetch('/api/platforms').then(r=>{ if(r.status===401){showLogin(); return null;} return r.json(); })
  .then(d=>{ if(d){ showApp(); loadAll(); } });
</script>
</body>
</html>
